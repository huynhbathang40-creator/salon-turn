<!doctype html><html><body><script type="module">
import QRCode from "qrcode";
import { cleanQr } from "/src/qrclean.js";
window.run = async () => {

  // fake phone screenshot: status bar, purple banner, name, small QR, footer text
  const c = document.createElement("canvas"); c.width = 1170; c.height = 2532; const g = c.getContext("2d");
  g.fillStyle = "#f4f0fa"; g.fillRect(0,0,1170,2532);
  g.fillStyle = "#6d1ed4"; g.fillRect(0,0,1170,420); g.fillStyle="#fff"; g.font="bold 64px sans-serif"; g.fillText("9:41        Zelle", 60, 120); g.fillText("Send Money with Zelle", 140, 320);
  g.fillStyle = "#222"; g.font = "56px sans-serif"; g.fillText("BAO NGUYEN", 380, 620);
  const qr = document.createElement("canvas"); await QRCode.toCanvas(qr, text, { width: 640, margin: 1, color: { dark: "#2b0a5c", light: "#ffffff" } });

};
</script></body></html>
